// ---- levels: build a Hamiltonian path (known solution), cut into segments

const LC=[];

const L={n,sol,pairs:sol.map(a=>({a:a[0],b:a[a.length-1]}))};validate(L);return LC[i]=L}

const diff=i=>i<10?'Beginner':i<20?'Intermediate':'Advanced';
// ---- state machine
const TR={INITIALIZING:['MAIN_MENU'],MAIN_MENU:['LOADING_LEVEL'],LOADING_LEVEL:['PLAYING'],PLAYING:['PAUSED','PROCESSING_CHAIN','LEVEL_COMPLETE','MAIN_MENU','LOADING_LEVEL'],PAUSED:['PLAYING','MAIN_MENU','LOADING_LEVEL'],PROCESSING_CHAIN:['PLAYING','LEVEL_COMPLETE','LOADING_LEVEL','MAIN_MENU'],LEVEL_COMPLETE:['LOADING_LEVEL','MAIN_MENU'],ERROR:['MAIN_MENU']};
const G={st:'INITIALIZING',lvl:0,mode:'solo',L:null,paths:[],moves:0,score:[0,0],turn:0,time:0,hints:0,hist:[],scored:[],chained:new Set(),drawing:null,pid:null,hint:null,parts:[],pulses:[],inv:0,invC:-1,trail:[],clock:0,queue:[],ct:0,kb:false,cur:0,back:'menu',winT:0};
function go(s){if(!TR[G.st]||!TR[G.st].includes(s)){console.warn('blocked transition',G.st,'->',s);return false}G.st=s;return true}
function fail(e){console.error(e);G.st='ERROR';show('err',e&&e.message||String(e))}
// ---- audio
let AC=null,musicTimer=0,musicStep=0,musicOn=false;const aud=()=>{if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=false}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC};
function tone(f,d=.12,ty='sine',v=.25,f2,dl=0){if(SET.mute)return;const a=aud();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(Math.max(.0002,v*SET.master*SET.sfx),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function stopMusic(){if(musicTimer)clearTimeout(musicTimer);musicTimer=0;musicOn=false}
function musicTone(f,d,v,type='triangle'){if(!AC||AC===false)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v*SET.master),t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){console.warn('Could not play background music:',e)}}
function syncMusic(){if(!SET.music||SET.mute||document.hidden||!aud()){stopMusic();return}if(musicOn)return;musicOn=true;const scale=[261.63,293.66,329.63,392,440,523.25,587.33,659.25],pattern=[0,2,4,5,4,2,1,3,5,7,5,3,1,0,2,4];function tick(){musicTimer=0;if(!musicOn||!SET.music||SET.mute||document.hidden){stopMusic();return}const i=musicStep%pattern.length,n=pattern[i];musicTone(scale[n],.3,.035);if(i%4===0)musicTone(scale[(n+3)%scale.length]/2,.48,.022,'sine');musicStep++;musicTimer=setTimeout(tick,380)}tick()}
const vib=n=>{if(SET.vib&&navigator.vibrate)try{navigator.vibrate(n)}catch(e){}};

// ---- game logic
const N=()=>G.L.n,epOf=c=>G.L.pairs.findIndex(p=>p.a===c||p.b===c);

function begin(c){if(G.st!=='PLAYING')return;if(G.drawing)end();let id=epOf(c);const snap=JSON.stringify(G.paths);

function invalid(c){G.inv=.35;G.invC=c;tone(130,.15,'sawtooth',.18);vib(40)}
function step(c){const g=G.drawing,p=G.paths[g.id];if(p.length>1&&c===p[p.length-2]){p.pop();tone(260,.04,'sine',.1);return true}

p.push(c);tone(300+p.length*14,.04,'sine',.1);if(complete(g.id)){const pl=G.turn,d=g;G.drawing=null;G.pid=null;commit(d);chain(g.id,pl)}return true}
function moveTo(c){const n=N();for(let k=0;k<n*2&&G.drawing;k++){const p=G.paths[G.drawing.id],l=p[p.length-1];if(l===c)break;const lr=l/n|0,lc=l%n,tr=c/n|0,tc=c%n;let nr=lr,nc=lc;if(Math.abs(tr-lr)>=Math.abs(tc-lc))nr+=Math.sign(tr-lr);else nc+=Math.sign(tc-lc);if(!step(nr*n+nc))break}}
function commit(d){const id=d.id;if(G.paths[id].length<2&&!complete(id))G.paths[id]=[];const now=JSON.stringify(G.paths);if(now!==d.snap){G.hist.push(d.snap);if(G.hist.length>100)G.hist.shift();G.moves++;if(G.mode!=='solo')G.turn^=1}}

function stepChain(){const id=G.queue.shift();if(id===undefined){const ok=G.paths.every((_,i)=>complete(i))&&G.paths.reduce((s,p)=>s+p.length,0)===N()*N();if(ok)win();else go('PLAYING');return}

SAVE.stars[G.lvl]=Math.max(SAVE.stars[G.lvl]||0,s);G.newTile=!had;G.newSkins=SKINS.filter(x=>x.need>tb&&x.need<=totalStars()).map(x=>x.n);SAVE.unlocked=Math.max(SAVE.unlocked,Math.min(30,G.lvl+2));save();arp([523,659,784,1047]);celebration();G.winT=setTimeout(()=>{if(G.st==='LEVEL_COMPLETE')show('win')},1200)}

function hint(){if(G.st!=='PLAYING'||G.drawing)return;const L=G.L;for(let i=0;i<L.pairs.length;i++){const p=G.paths[i];let s=L.sol[i];if(p.length&&p[0]===L.pairs[i].b)s=s.slice().reverse();let k=0;while(k<p.length&&k<s.length&&p[k]===s[k])k++;if(k===s.length&&p.length===s.length)continue;

// ---- layout & render
const cv=$('#cv'),ctx=cv.getContext('2d'),bg=document.createElement('canvas'),bx=bg.getContext('2d');let S=300,pad=10,cs=30,dpr=1;

function burst(id){if(SET.reduce)return;const P=G.paths[id];if(!P.length)return;for(const c of[P[0],P[P.length-1]])for(let k=0;k<14&&G.parts.length<160;k++){const a=Math.random()*6.28,v=40+Math.random()*90;G.parts.push({x:cx(c),y:cy(c),vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c:COL[id%8]})}}

function draw(){if(!G.L)return;ctx.clearRect(0,0,S,S);ctx.drawImage(bg,0,0,S,S);const w=cs*.26,pt=i=>G.paths[i].map(c=>({x:cx(c),y:cy(c)}));tiles();
G.paths.forEach((_,i)=>{const P=pt(i),c=COL[i%8],act=G.drawing&&G.drawing.id===i;line(P,c,w*1.9,.2,cs*.5);line(P,c,w*(act?1.15:1),.92,cs*.2);line(P,'#fff',w*.32,.85,0);
if(!SET.reduce&&P.length>1&&complete(i)){const q=along(P,(G.clock*.35+i*.19)%1);dot(q.x,q.y,w*.3,'#fff',.9)}});
for(const p of G.pulses){const P=pt(p.id);if(P.length>1){const q=along(P,p.t);dot(q.x,q.y,w*.55,'#fff')}}
const hp=G.hint;if(hp){const a=.5+.5*Math.sin(G.clock*7);ctx.save();ctx.strokeStyle=COL[hp.id%8];ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.globalAlpha=.5+a*.5;ctx.beginPath();ctx.arc(cx(hp.cell),cy(hp.cell),cs*(.3+.08*a),0,7);ctx.stroke();ctx.restore()}
G.L.pairs.forEach((P,i)=>{const c=COL[i%8],ok=complete(i),act=G.drawing&&G.drawing.id===i;for(const e of[P.a,P.b]){const x=cx(e),y=cy(e),r=cs*(.3+(ok&&!SET.reduce?.03*Math.sin(G.clock*4):0));dot(x,y,r*1.5,c,ok?.3:.15);const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.5,c);g.addColorStop(1,c);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle=ok?'#fff':c;ctx.lineWidth=ok?3:2;ctx.globalAlpha=ok||act?1:.7;ctx.beginPath();ctx.arc(x,y,r*(act?1.45:1.28),0,7);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#04102c';ctx.font='bold '+(cs*.28|0)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(SYM[i%8],x,y+1)}});
for(const p of G.parts)dot(p.x,p.y,p.r||cs*.05,p.c,Math.max(0,p.l));
if(G.inv>0){ctx.strokeStyle='#ff3b4a';ctx.lineWidth=3;ctx.globalAlpha=G.inv*2.5;ctx.strokeRect(cx(G.invC)-cs/2+2,cy(G.invC)-cs/2+2,cs-4,cs-4);ctx.globalAlpha=1}
if(G.kb){ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.strokeRect(cx(G.cur)-cs/2+3,cy(G.cur)-cs/2+3,cs-6,cs-6)}

// ---- collectible tile skins (cosmetic only)
function tiles(){const k=SAVE.skin;if(!k)return;ctx.save();G.paths.forEach((p,i)=>{ctx.fillStyle=ctx.strokeStyle=COL[i%8];p.forEach(q=>{const x=cx(q),y=cy(q),h=cs*.44;ctx.lineWidth=1.5;
if(k===1){ctx.globalAlpha=.16;ctx.beginPath();ctx.roundRect(x-h,y-h,h*2,h*2,cs*.14);ctx.fill();ctx.globalAlpha=.4;ctx.lineWidth=1;ctx.stroke()}
else if(k===2){ctx.globalAlpha=.2;ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x+h,y);ctx.lineTo(x,y+h);ctx.lineTo(x-h,y);ctx.closePath();ctx.fill()}

// ---- async co-op turn codes (no server: copy/paste between partners)
function exportCode(){return'LL1-'+btoa(JSON.stringify({l:G.lvl,p:G.paths,m:G.moves,s:G.score,t:G.turn,h:G.hints,ti:Math.floor(G.time)}))}
function parseCode(s){s=String(s||'').trim();if(!s.startsWith('LL1-')||s.length>20000)throw Error('Not a Lime Link code');let d;try{d=JSON.parse(atob(s.slice(4)))}catch(e){throw Error('Code is damaged')}
const l=d&&d.l;if(!Number.isInteger(l)||l<0||l>29)throw Error('Unknown level');const L=genLevel(l),n=L.n,seen=new Set();if(!Array.isArray(d.p)||d.p.length!==L.pairs.length)throw Error('Code does not match level');
d.p.forEach((p,i)=>{if(!Array.isArray(p)||p.length>n*n)throw Error('Bad path in code');const P=L.pairs[i];p.forEach((c,j)=>{if(!Number.isInteger(c)||c<0||c>=n*n||seen.has(c))throw Error('Bad path in code');seen.add(c);if(j&&!nbr(p[j-1],n).includes(c))throw Error('Bad path in code');const e=L.pairs.findIndex(q=>q.a===c||q.b===c);if(e>=0&&e!==i)throw Error('Bad path in code');if(e===i&&j>0&&j<p.length-1)throw Error('Bad path in code')});if(p.length&&p[0]!==P.a&&p[0]!==P.b)throw Error('Bad path in code')});
const num=(x,mx)=>Number.isFinite(x)?Math.max(0,Math.min(mx,Math.floor(x))):0;return{l,p:d.p.map(p=>p.slice()),m:num(d.m,9999),s:[num(d.s&&d.s[0],999999),num(d.s&&d.s[1],999999)],t:d.t===1?1:0,h:num(d.h,999),ti:num(d.ti,99999)}}
// ---- loop
let raf=0,last=0;const hc={};
function setT(id,v){if(hc[id]!==v){hc[id]=v;$(id).textContent=v}}
function hud(){const t=Math.floor(G.time),n=G.L?N()*N():1;setT('#sc',G.mode==='duo'?G.score[0]+' | '+G.score[1]:''+G.score[0]);setT('#mv',''+G.moves);setT('#tm',(t/60|0)+':'+String(t%60).padStart(2,'0'));setT('#lv','Lv '+(G.lvl+1)+' · '+diff(G.lvl));setT('#turn',G.mode==='solo'?'Solo mode':(G.mode==='coop'?'Co-op · ':'')+'Player '+(G.turn+1)+"'s turn");$('#fill').style.width=Math.round(G.paths.reduce((s,p)=>s+p.length,0)/n*100)+'%';setT('#mb',SET.mute?'🔇':'🔊');$('#rb').style.display=G.mode==='solo'?'none':'';$('#sb').style.display=G.mode==='coop'?'':'none'}
function frame(ts){raf=requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;G.clock+=dt;
if(G.st==='PLAYING'&&ov.style.display!=='flex')G.time+=dt;if(G.st==='PROCESSING_CHAIN'){G.ct-=dt;if(G.ct<=0)stepChain()}
G.pulses=G.pulses.filter(p=>(p.t+=dt*1.8)<1);for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.2}G.parts=G.parts.filter(p=>p.l>0);G.trail.forEach(t=>t.l-=dt*4);G.trail=G.trail.filter(t=>t.l>0);G.inv=Math.max(0,G.inv-dt);if(G.hint&&(G.hint.t-=dt)<=0)G.hint=null;
try{hud();draw()}catch(e){cancelAnimationFrame(raf);raf=0;fail(e)}}

function cellAt(e){const r=cv.getBoundingClientRect(),n=N(),x=(e.clientX-r.left)*S/r.width,y=(e.clientY-r.top)*S/r.height,f=v=>Math.min(n-1,Math.max(0,Math.floor((v-pad)/cs)));return f(y)*n+f(x)}
function trail(e){const r=cv.getBoundingClientRect();G.trail.push({x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height,l:1});if(G.trail.length>14)G.trail.shift()}
cv.addEventListener('pointerdown',e=>{if(G.pid!==null||G.st!=='PLAYING')return;e.preventDefault();aud();G.kb=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}G.pid=e.pointerId;begin(cellAt(e));if(!G.drawing)G.pid=null;trail(e)});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==G.pid)return;e.preventDefault();trail(e);if(G.drawing&&G.st==='PLAYING')moveTo(cellAt(e))});

if(m!==undefined){e.preventDefault();G.kb=true;const r=G.cur/n|0,c=G.cur%n;if(k==='ArrowLeft'&&c>0||k==='ArrowRight'&&c<n-1||k==='ArrowUp'&&r>0||k==='ArrowDown'&&r<n-1){G.cur+=m;if(G.drawing)moveTo(G.cur)}handCell(G.cur,!!G.drawing,900)}
else if(k===' '||k==='Enter'){e.preventDefault();G.kb=true;aud();G.drawing?end():begin(G.cur);handCell(G.cur,!!G.drawing,900)}else if(k==='Escape')pause();else if(k==='z'||k==='Z')undo();else if(k==='h'||k==='H')hint()});

const HD=$('#hand'),HI=HD.firstElementChild;let hT=0,hSz=0;

function handAt(x,y,down,hold){if(!SET.hand)return;handSize();clearTimeout(hT);HD.style.display='block';HD.classList.remove('off');HD.classList.toggle('down',!!down);HD.style.transform=`translate(${(x-hSz*.23).toFixed(1)}px,${(y-hSz*.02).toFixed(1)}px)`;if(hold)hT=setTimeout(handOff,hold)}

// ---- UI
const B=(a,t,c='',v='',x='')=>`<button class="btn ${c} ${x}" data-a="${a}" data-v="${v}">${t}</button>`,ov=$('#ov');let tt=0;

const P={
menu:()=>`<div class="panel"><div class="logo big">LIME<span>LINK</span></div><p class="sm">Link matching nodes with glowing paths and fill every cell.</p>${B('play','▶ PLAY','g')}${B('levels','LEVELS')}${B('mode','MODE: '+({solo:'SOLO',duo:'2 PLAYER',coop:'CO-OP'}[G.mode]))}${B('skins','TILE SKINS')}${B('mural','MY MURAL')}${B('how','HOW TO PLAY')}${B('settings','SETTINGS','y')}</div>`,
levels:()=>`<div class="panel"><h2>LEVELS</h2><div class="lg">${Array.from({length:30},(_,i)=>{const u=i<SAVE.unlocked;return`<button class="btn ${i<10?'g':i<20?'y':'r'}" ${u?'':'disabled'} data-a="lvl" data-v="${i}" aria-label="Level ${i+1} ${diff(i)}">${u?i+1:'🔒'}<small>${'★'.repeat(SAVE.stars[i]||0)||'·'}</small></button>`}).join('')}</div><p class="sm">Green = Beginner, Yellow = Intermediate, Red = Advanced. Stars you earn fill your <b>local-only</b> mosaic on this device.</p>${B('menu','BACK')}</div>`,
mode:()=>`<div class="panel"><h2>GAME MODE</h2>${B('setmode','SOLO','g','solo')}${B('setmode','2 PLAYER LOCAL','','duo')}<p class="sm">Local 2 player: take turns on this device; each finished stroke passes the turn and points go to the player who connects.</p>${B('coop','ASYNC CO-OP','y')}<p class="sm">Take turns at your own pace: play, press Send, and share the turn code with your partner in any chat. No account or server needed.</p><button class="btn" disabled>COMMUNITY MURALS · COMING LATER</button><p class="sm">Seasonal community murals and user-made puzzles need moderation tools and an online service, so they are planned for later.</p>${B('menu','BACK')}</div>`,
how:()=>`<div class="panel"><h2>HOW TO PLAY</h2><p class="sm">• Press a node and drag through adjacent cells to its matching twin (symbols help without color).<br>• Paths can't cross; drawing over another path cuts it.<br>• Drag back to retrace. Connect all pairs AND fill every cell to win.<br>• A connection pulses into touching connections for bonus chain points.<br>• Keyboard: arrows move, Space/Enter starts/stops a path, Z undo, H hint, Esc pause.<br>• Hints always follow a known solution and are always free.<br>• Precision bonus: finish in very few strokes without hints.<br>• Rewards never expire: no daily streaks, no purchases, nothing lost for missing a day.<br>• 2 Player and Co-op reactions are preset text only.</p>${B('menu','BACK')}</div>`,
settings:()=>`<div class="panel"><h2>SETTINGS</h2>${sl('master','Master volume')}${sl('sfx','Effects volume')}${ck('music','Background music')}${ck('mute','Mute')}${ck('reduce','Reduced motion')}${ck('glow','Glow effects')}${ck('vib','Vibration')}${ck('hand','Show hand pointer')}${B('back','BACK','g')}</div>`,

mural:()=>`<div class="panel"><h2>MY MURAL</h2><p class="sm">Every level you finish adds a tile; more stars make it brighter. Stored only on this device.</p><div class="mu">${Array.from({length:30},(_,i)=>{const s=SAVE.stars[i]||0;return s?`<i style="background:${COL[i%8]};opacity:${.4+.2*s};color:#04102c">${i+1}</i>`:`<i>${i+1}</i>`}).join('')}</div><p class="sm">${SAVE.stars.filter(x=>x>0).length}/30 tiles placed.</p><button class="btn" disabled>COMMUNITY MURALS · COMING LATER</button>${B('menu','BACK')}</div>`,
